<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>사진 업로드</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업로더" id="appTitle">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8e8e93;--line:#c6c6c8;--blue:#007aff;--red:#ff3b30;--green:#34c759;--fill:#e5e5ea;--bar:rgba(249,249,249,.88)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--line:#38383a;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--fill:#2c2c2e;--bar:rgba(22,22,24,.88)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(150px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.4px;margin:12px 0 2px}
.lead{color:var(--sub);font-size:15px;margin:0 0 4px}
.title{font-size:13px;color:var(--sub);margin:22px 16px 6px;display:flex;justify-content:space-between}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;padding:0 16px;min-height:46px;border-bottom:.5px solid var(--line)}
.cell:last-child{border-bottom:0}
.cell label{width:88px;flex:none}
.cell input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;padding:12px 0;outline:0}
textarea{display:block;width:100%;border:0;background:transparent;color:var(--text);font:inherit;padding:12px 16px;outline:0;resize:none}
::placeholder{color:var(--sub);opacity:.7}
.add{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;color:var(--blue);font-weight:500;cursor:pointer}
.add .plus{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;line-height:1;font-weight:400}
.add input{display:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:.5px solid var(--line)}
.opt small{display:block;color:var(--sub);font-size:13px;line-height:1.3;margin-top:2px}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;outline:0;border:0;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.sw:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px;border-top:.5px solid var(--line)}
.grid:empty{display:none}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--fill)}
.th canvas,.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;font-weight:600}
.th .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:1;padding:0}
.alert{margin:14px 0 0;padding:12px 14px;border-radius:12px;font-size:15px;white-space:pre-wrap;background:rgba(255,59,48,.12);color:var(--red)}
.alert.info{background:var(--fill);color:var(--text)}
.alert[hidden]{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.bottom>div{max-width:560px;margin:0 auto}
.status{font-size:13px;color:var(--sub);text-align:center;margin:0 0 8px;min-height:16px}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.bar[hidden]{display:none}
.btn{display:block;width:100%;height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-weight:600}
.btn:disabled{opacity:.35}
.btn:active:not(:disabled){opacity:.8}
.btn.sec{background:transparent;color:var(--blue);height:44px;font-weight:500;margin-bottom:4px}
.btn[hidden]{display:none}
#done{text-align:center;padding-top:72px}
#done[hidden]{display:none}
.check{width:84px;height:84px;border-radius:50%;background:var(--green);margin:0 auto 20px;display:grid;place-items:center}
.check svg{width:44px;height:44px}
#done h2{font-size:28px;margin:0 0 6px}
#done .no{font-size:34px;font-weight:700;letter-spacing:.5px;margin:18px 0 4px;font-variant-numeric:tabular-nums}
#done p{color:var(--sub);margin:0}
#done .tm{font-size:12px;margin-top:22px}
</style></head>
<body>
<main>
  <div id="form" hidden>
    <h1 id="co">사진 업로드</h1>
    <p class="lead">작업 정보를 입력하고 사진을 올려주세요</p>

    <div class="title"><span>작업 정보</span></div>
    <div class="group">
      <div class="cell"><label for="vehicle">작업 대상</label><input id="vehicle" maxlength="20" placeholder="예) BMW 520d" autocomplete="off"></div>
      <div class="cell"><label for="work">작업 내용</label><input id="work" maxlength="20" placeholder="예) 엔진오일 교환" autocomplete="off"></div>
    </div>

    <div class="title"><span>특이사항</span><span>선택</span></div>
    <div class="group"><textarea id="note" rows="3" maxlength="500" placeholder="전달할 내용이 있으면 적어 주세요"></textarea></div>

    <div class="title"><span>사진</span><span id="cnt"></span></div>
    <div class="group">
      <label class="add" id="addbtn"><span class="plus">+</span>사진 선택 또는 촬영<input id="pick" type="file" accept="image/*" multiple></label>
      <div class="opt"><div>원본 화질로 올리기<small>꺼 두면 네이버 블로그에 맞는 크기로 줄여서 훨씬 빠르게 올라갑니다</small></div><input id="orig" class="sw" type="checkbox" aria-label="원본 화질로 올리기"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="alert" id="alert" hidden></div>
  </div>

  <div id="done" hidden>
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>업로드 완료</h2>
    <p id="donecnt"></p>
    <div class="no" id="doneno"></div>
    <p>접수번호</p>
    <p class="tm" id="timing"></p>
  </div>

  <div id="loading" class="lead" style="margin-top:40px;text-align:center">링크를 확인하는 중…</div>
</main>

<div class="bottom" id="bottom" hidden><div>
  <div class="bar" id="barwrap" hidden><i id="barfill"></i></div>
  <div class="status" id="status"></div>
  <button class="btn sec" id="retry" type="button" hidden>실패한 사진 다시 올리기</button>
  <button class="btn" id="go" type="button" disabled>업로드</button>
  <button class="btn" id="again" type="button" hidden>새 작업 올리기</button>
</div></div>

<script src="config.js"></script>
<script>
const CHUNK = 8 * 1024 * 1024;           // 256KB 배수
const MAX_FILES = 30, MAX_BYTES = 25 * 1024 * 1024;
const LONG_EDGE = 1920, QUALITY = 0.85;  // 네이버 블로그용 크기 (긴 변 기준). 값을 바꾸면 압축 크기가 달라진다
const KEEP_UNDER = 1.5 * 1024 * 1024;    // 이미 작은 JPEG 는 다시 압축하지 않는다
const PARALLEL = 2;                      // 동시에 올리는 사진 수
const TYPES = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif' };
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
// text/plain 으로 보내 CORS preflight 를 피한다
const api = body => fetch(API_URL, { method: 'POST', body: JSON.stringify({ token, ...body }) }).then(r => r.json());

let photos = [];     // { file, origType, key, el, state:'prep'|'ready', blob, sendType, thumbed }
let job = null;      // { receiptNo, blobs:[Blob], t } 접수를 시작한 뒤 고정
let busy = false, autoTries = 0, resumeChecked = false;

const typeOf = f => {
  if (Object.values(TYPES).includes(f.type)) return f.type;
  return TYPES[(f.name.split('.').pop() || '').toLowerCase()] || '';
};
const mbOf = b => (b / 1048576).toFixed(1) + 'MB';
function alertBox(t, info) { const a = $('alert'); a.hidden = !t; a.textContent = t || ''; a.className = 'alert' + (info ? ' info' : ''); }
function setStatus(t) { $('status').textContent = t || ''; }

function refresh() {
  const ready = photos.filter(p => p.state === 'ready').length;
  const total = photos.reduce((s, p) => s + (p.blob ? p.blob.size : p.file.size), 0);
  $('cnt').textContent = !photos.length ? '' : ready < photos.length ? `준비 중 ${ready}/${photos.length}` : `${photos.length}/${MAX_FILES}장 · ${mbOf(total)}`;
  const ok = $('vehicle').value.trim() && $('work').value.trim() && photos.length > 0 && ready === photos.length;
  $('go').disabled = busy || !!job || !ok;
  $('go').textContent = photos.length && ready < photos.length ? '사진 준비 중…' : '업로드';
  $('pick').disabled = busy || !!job;
  $('orig').disabled = busy || !!job;
  $('addbtn').style.opacity = (busy || job) ? .4 : 1;
  document.querySelectorAll('.th .x').forEach(b => b.hidden = busy || !!job);
  ['vehicle', 'work', 'note'].forEach(id => $(id).disabled = busy || !!job);
}
['vehicle', 'work'].forEach(id => $(id).addEventListener('input', refresh));

// ---------- 사진 준비: 미리보기 + (필요하면) 네이버 블로그용 크기로 줄이기 ----------
const toBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));

async function prepare(p) {
  if (!photos.includes(p)) return;
  let bm = null;
  try { bm = await createImageBitmap(p.file, { imageOrientation: 'from-image' }); }
  catch (e) { try { bm = await createImageBitmap(p.file); } catch (e2) {} }

  if (!p.thumbed) {
    p.thumbed = true;
    if (bm) {
      const s = 240 / Math.max(bm.width, bm.height), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bm.width * s)); c.height = Math.max(1, Math.round(bm.height * s));
      c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      p.el.prepend(c);
    } else {
      const t = document.createElement('span'); t.className = 'ph'; t.textContent = (p.file.name.split('.').pop() || '사진').toUpperCase();
      p.el.prepend(t);
    }
  }

  p.blob = p.file; p.sendType = p.origType;
  if (bm && !$('orig').checked) {
    const long = Math.max(bm.width, bm.height);
    if (!(long <= LONG_EDGE && p.origType === 'image/jpeg' && p.file.size <= KEEP_UNDER)) {
      const k = Math.min(1, LONG_EDGE / long), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bm.width * k)); c.height = Math.max(1, Math.round(bm.height * k));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bm, 0, 0, c.width, c.height);
      const b = await toBlob(c, 'image/jpeg', QUALITY);
      if (b && b.size < p.file.size) { p.blob = b; p.sendType = 'image/jpeg'; }   // 줄어든 경우에만 사용
      c.width = c.height = 0;
    }
  }
  if (bm && bm.close) bm.close();
  p.state = 'ready'; refresh();
}

let chain = Promise.resolve();
const queuePrepare = p => {
  p.state = 'prep';
  chain = chain.then(() => prepare(p)).catch(() => { p.blob = p.blob || p.file; p.sendType = p.sendType || p.origType; p.state = 'ready'; refresh(); });
};

try { $('orig').checked = localStorage.getItem('orig') === '1'; } catch (e) {}
$('orig').onchange = () => {
  try { localStorage.setItem('orig', $('orig').checked ? '1' : '0'); } catch (e) {}
  photos.forEach(queuePrepare); refresh();
};

$('pick').onchange = () => {
  const skipped = [];
  for (const f of [...$('pick').files]) {
    const type = typeOf(f), key = f.name + '|' + f.size + '|' + f.lastModified;
    if (photos.some(p => p.key === key)) continue;
    if (!type) { skipped.push(`${f.name}: 이미지 파일이 아닙니다`); continue; }
    if (f.size > MAX_BYTES) { skipped.push(`${f.name}: 25MB를 넘습니다 (${mbOf(f.size)})`); continue; }
    if (photos.length >= MAX_FILES) { skipped.push(`${f.name}: 사진은 최대 ${MAX_FILES}장까지 가능합니다`); continue; }
    const p = { file: f, origType: type, key, el: document.createElement('div'), state: 'prep', blob: null, sendType: type, thumbed: false };
    p.el.className = 'th';
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', '삭제');
    x.onclick = () => { photos = photos.filter(q => q !== p); p.el.remove(); refresh(); };
    p.el.append(x); $('grid').append(p.el); photos.push(p);
    queuePrepare(p);
  }
  $('pick').value = '';
  alertBox(skipped.length ? '다음 사진은 추가하지 않았습니다.\n' + skipped.join('\n') : '', false);
  refresh();
};

// ---------- 폰에 임시 보관 (IndexedDB): 앱을 닫아도 다음에 열면 이어서 올린다 ----------
let dbp = null;
const idb = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('jshine-upload', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('jobs', { keyPath: 'token' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const idbTx = async (mode, fn) => {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('jobs', mode), rq = fn(tx.objectStore('jobs'));
    tx.oncomplete = () => res(rq && rq.result); tx.onerror = tx.onabort = () => rej(tx.error);
  });
};
const idbPut = rec => idbTx('readwrite', s => s.put(rec));
const idbGet = () => idbTx('readonly', s => s.get(token));
const idbDel = () => idbTx('readwrite', s => s.delete(token));

// ---------- 화면이 꺼지지 않게 (업로드 중) ----------
let wl = null;
async function lockScreen() { try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {} }
function unlockScreen() { try { if (wl) wl.release(); } catch (e) {} wl = null; }

// ---------- 전송 ----------
function putRange(url, blob, start, total, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Range', `bytes ${start}-${start + blob.size - 1}/${total}`);
    if (onProgress) x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => ([200, 201, 308].includes(x.status) ? resolve() : reject(new Error('HTTP ' + x.status)));
    x.onerror = () => reject(new Error('network'));
    x.send(blob); // Blob 그대로 전송 (Base64 변환 없음, 메모리에 전체를 올리지 않음)
  });
}
async function withRetry(fn, n = 5) {
  for (let i = 0; ; i++) {
    try { return await fn(); } catch (e) {
      if (i >= n - 1) throw e;
      setStatus(`네트워크가 불안정합니다. 다시 시도하는 중 (${i + 1}/${n - 1})`);
      await new Promise(r => setTimeout(r, 1000 * 2 ** i));
    }
  }
}

// 사진 이름의 순번(01.jpg 등)으로 보관해 둔 Blob 과 연결해, PARALLEL 장씩 동시에 올린다
async function uploadAll(list) {
  const total = list.reduce((s, x) => s + x.size, 0) || 1;
  const sent = new Map();
  let next = 0, done = 0, err = null;
  $('barwrap').hidden = false; $('barfill').style.width = '0%';
  const upd = () => {
    const pct = Math.min(100, Math.round([...sent.values()].reduce((a, b) => a + b, 0) / total * 100));
    $('barfill').style.width = pct + '%'; setStatus(`${done}/${list.length}장 완료 · ${pct}%`);
  };
  const worker = async () => {
    while (!err && next < list.length) {
      const s = list[next++], blob = job.blobs[parseInt(s.name, 10) - 1];
      try {
        for (let off = 0; off < blob.size; off += CHUNK) {
          const part = blob.slice(off, Math.min(off + CHUNK, blob.size));
          await withRetry(() => putRange(s.uploadUrl, part, off, blob.size, n => { sent.set(s.name, off + n); upd(); }));
          sent.set(s.name, off + part.size); upd();
        }
        done++; upd();
      } catch (e) { err = err || e; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(PARALLEL, list.length) }, worker));
  if (err) throw err;
}

function showDone(no, count, t) {
  $('form').hidden = true; $('go').hidden = true; $('retry').hidden = true; $('barwrap').hidden = true; setStatus('');
  $('doneno').textContent = no; $('donecnt').textContent = `사진 ${count}장이 저장되었습니다`;
  if (t && t.t3) {
    const s = (a, b) => ((b - a) / 1000).toFixed(1);
    $('timing').textContent = `준비 ${s(t.t0, t.t1)}초 · 전송 ${s(t.t1, t.t2)}초 · 확인 ${s(t.t2, t.t3)}초`;
  }
  alertBox('');
  $('done').hidden = false; $('again').hidden = false;
}

async function finish() {
  setStatus('저장 확인 중…');
  const c = await api({ action: 'commit', receiptNo: job.receiptNo });
  if (!c.ok) throw new Error('일부 사진이 저장되지 않았습니다.\n"실패한 사진 다시 올리기"를 눌러 주세요.');
  if (job.t) job.t.t3 = performance.now();
  try { await idbDel(); } catch (e) {}
  const t = job.t; autoTries = 0;
  showDone(c.receiptNo, c.count, t);
  job = null;
}

function fail(err) {
  const m = String(err.message || err);
  setStatus(''); $('barwrap').hidden = true;
  if (job && /이미 완료된 접수/.test(m)) { const j = job; idbDel().catch(() => {}); job = null; showDone(j.receiptNo, j.blobs.length); return; }
  if (job && /접수 내역이 없습니다/.test(m)) {
    idbDel().catch(() => {}); job = null; refresh();
    alertBox('이전 업로드 기록이 서버에 없어 정리했습니다.\n처음부터 다시 올려 주세요'); return;
  }
  const net = m === 'network' || m === 'Failed to fetch' || /^HTTP /.test(m);
  alertBox(m + (job ? `\n접수번호 ${job.receiptNo}` : ''));
  if (job) {
    $('retry').hidden = false;
    if (net && autoTries < 3) {
      autoTries++; setStatus(`연결이 끊겨 잠시 후 다시 시도합니다 (${autoTries}/3)`);
      setTimeout(() => { if (!busy && job) runResume(); }, 3000);
    }
  }
}

const guard = e => { e.preventDefault(); e.returnValue = ''; };
function setBusy(b) { busy = b; b ? addEventListener('beforeunload', guard) : removeEventListener('beforeunload', guard); refresh(); }

$('go').onclick = async () => {
  if (busy || job || photos.some(p => p.state !== 'ready')) return;
  alertBox(''); $('retry').hidden = true; autoTries = 0; setBusy(true); lockScreen();
  const t = { t0: performance.now() };
  try {
    setStatus('업로드 준비 중…');
    const items = photos.map(p => ({ blob: p.blob, name: p.file.name, type: p.sendType }));
    const b = await api({ action: 'begin', vehicle: $('vehicle').value, work: $('work').value, note: $('note').value,
      files: items.map(f => ({ name: f.name, size: f.blob.size, type: f.type })) });
    if (!b.ok) throw new Error(b.error);
    t.t1 = performance.now();
    job = { receiptNo: b.receiptNo, blobs: items.map(f => f.blob), t };
    try { await idbPut({ token, receiptNo: b.receiptNo, at: Date.now(), files: job.blobs.map(blob => ({ blob })) }); } catch (e) {}
    await uploadAll(b.files);
    t.t2 = performance.now();
    await finish();
  } catch (err) { fail(err); } finally { setBusy(false); unlockScreen(); }
};

async function runResume() {
  if (busy || !job) return;
  alertBox(''); $('retry').hidden = true; setBusy(true); lockScreen();
  job.t = null;
  try {
    setStatus('이어서 올리는 중…');
    const r = await api({ action: 'resume', receiptNo: job.receiptNo });
    if (!r.ok) throw new Error(r.error);
    if (r.files.length) await uploadAll(r.files);
    await finish();
  } catch (err) { fail(err); } finally { setBusy(false); unlockScreen(); }
}
$('retry').onclick = () => { autoTries = 0; runResume(); };

// 앱을 닫았다가 다시 열었을 때, 끝내지 못한 업로드가 있으면 자동으로 이어서 올린다
async function maybeResume() {
  if (resumeChecked || busy || job) return;
  resumeChecked = true;
  let rec; try { rec = await idbGet(); } catch (e) { return; }
  if (!rec || !rec.files || !rec.files.length) return;
  job = { receiptNo: rec.receiptNo, blobs: rec.files.map(f => f.blob), t: null };
  alertBox(`이전에 끝내지 못한 업로드(접수번호 ${rec.receiptNo})를 이어서 올립니다`, true);
  refresh(); runResume();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (busy) lockScreen();                                    // 화면 꺼짐 방지는 앱이 다시 보일 때 다시 건다
  else if (job && !$('retry').hidden) runResume();           // 끊긴 업로드는 앱으로 돌아오면 바로 이어간다
});

$('again').onclick = () => location.reload();

// ---------- 홈 화면 앱 정보와 시작 ----------
// 홈 화면에 추가할 때 쓸 앱 이름("업체명 업로더")과 설치 정보. 시작 주소에 업체 토큰이 그대로 들어간다
function setApp(name) {
  const title = name + ' 업로더';
  document.title = title;
  $('appTitle').content = title;
  const abs = f => new URL(f, location.href).href;
  const m = { name: title, short_name: title, start_url: location.href, scope: new URL('./', location.href).href, display: 'standalone',
    background_color: '#f2f2f7', theme_color: '#f2f2f7',
    icons: [{ src: abs('icon-192.png'), sizes: '192x192', type: 'image/png' }, { src: abs('icon-512.png'), sizes: '512x512', type: 'image/png' }] };
  let l = document.querySelector('link[rel=manifest]');
  if (!l) { l = document.createElement('link'); l.rel = 'manifest'; document.head.append(l); }
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
}

// 업체명을 폰에 기억해 두고 입력 화면을 먼저 띄운다. 링크 확인은 뒤에서 하며, 업로드할 때 서버가 다시 검증한다
const cacheKey = 'co:' + token;
const cached = (() => { try { return localStorage.getItem(cacheKey) || ''; } catch (e) { return ''; } })();
function showForm(name) {
  $('co').textContent = name; setApp(name);
  $('loading').hidden = true; $('form').hidden = false; $('bottom').hidden = false; refresh();
}
function showError(t) {
  $('form').hidden = true; $('bottom').hidden = true;
  $('loading').hidden = false; $('loading').textContent = t; $('loading').style.color = 'var(--red)';
}
if (cached) { showForm(cached); maybeResume(); }

(async () => {
  try {
    const r = await api({ action: 'info' });
    if (!r.ok) { const bad = new Error(r.error); bad.invalid = true; throw bad; }
    try { localStorage.setItem(cacheKey, r.name); } catch (e) {}
    if (r.name !== cached) showForm(r.name);
    maybeResume();
  } catch (e) {
    if (!e.invalid) { if (!cached) showError('서버에 연결할 수 없습니다'); return; }  // 네트워크 문제: 저장된 정보로 계속 사용
    try { localStorage.removeItem(cacheKey); } catch (e2) {}
    showError(e.message);
  }
})();
</script></body></html>
