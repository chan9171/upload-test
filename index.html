<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>업로드 스파이크</title>
<style>body{font:16px sans-serif;margin:16px}button{padding:12px 16px;font-size:16px}pre{white-space:pre-wrap;background:#f3f3f3;padding:8px}progress{width:100%}</style></head>
<body>
<h3>Drive 직접 업로드 테스트</h3>
<input id="api" placeholder="Apps Script 웹앱 URL (/exec)" style="width:100%;margin-bottom:8px">
<input id="pick" type="file" accept="image/*" multiple>
<p><button id="go">업로드</button></p>
<progress id="bar" value="0" max="1"></progress>
<pre id="log"></pre>
<script>
const CHUNK = 4 * 1024 * 1024; // 256KB 배수
const log = m => { document.getElementById('log').textContent += m + '\n'; };
// text/plain 으로 보내 CORS preflight 를 피한다
const api = body => fetch(document.getElementById('api').value, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());

function putRange(url, blob, start, total) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Range', `bytes ${start}-${start + blob.size - 1}/${total}`);
    x.onload = () => ([200, 201, 308].includes(x.status) ? resolve(x.status) : reject(new Error('HTTP ' + x.status)));
    x.onerror = () => reject(new Error('network'));
    x.send(blob); // Blob 를 그대로 전송 (Base64 변환 없음)
  });
}
async function withRetry(fn, n = 5) {
  for (let i = 0; ; i++) {
    try { return await fn(); } catch (e) {
      if (i >= n - 1) throw e;
      log('  재시도 ' + (i + 1) + ': ' + e.message);
      await new Promise(r => setTimeout(r, 1000 * 2 ** i));
    }
  }
}
document.getElementById('go').onclick = async () => {
  const files = [...document.getElementById('pick').files];
  if (!files.length) return log('사진을 선택하세요');
  const t0 = performance.now();
  const total = files.reduce((s, f) => s + f.size, 0);
  let sent = 0;
  const bar = document.getElementById('bar');
  const begin = await api({ action: 'begin', files: files.map(f => ({ name: f.name, size: f.size, type: f.type })) });
  if (!begin.ok) return log('begin 실패: ' + begin.error);
  log('접수번호 ' + begin.receiptNo);
  for (let i = 0; i < files.length; i++) {
    const f = files[i], s = begin.files[i];
    log(`${s.name} (${(f.size / 1048576).toFixed(1)}MB)`);
    for (let off = 0; off < f.size; off += CHUNK) {
      const part = f.slice(off, Math.min(off + CHUNK, f.size));
      await withRetry(() => putRange(s.uploadUrl, part, off, f.size));
      sent += part.size; bar.value = sent / total;
    }
  }
  const v = await api({ action: 'verify', folderId: begin.folderId, files: begin.files.map(f => ({ name: f.name, size: f.size })) });
  log(v.ok ? `검증 성공: Drive 파일 ${v.count}개 일치` : '검증 실패: ' + JSON.stringify(v));
  log(((performance.now() - t0) / 1000).toFixed(1) + '초');
};
</script></body></html>
