<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>사진 접수 관리</title>
<style>
*{box-sizing:border-box}body{font:14px/1.5 -apple-system,"Malgun Gothic",sans-serif;margin:0;color:#1f2933;background:#f5f6f7}
header{background:#243b53;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px}
header h1{font-size:16px;margin:0;flex:1}
main{padding:16px;max-width:1100px;margin:0 auto}
nav{display:flex;gap:4px;margin-bottom:12px}
nav button{border:1px solid #9aa5b1;background:#fff;padding:6px 14px;cursor:pointer;font:inherit}
nav button.on{background:#243b53;color:#fff;border-color:#243b53}
button{font:inherit;cursor:pointer}
.btn{padding:5px 10px;border:1px solid #243b53;background:#fff;color:#243b53;border-radius:3px}
.btn.pri{background:#243b53;color:#fff}.btn.warn{border-color:#b8272c;color:#b8272c}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #d9dee3;padding:5px 8px;text-align:left;vertical-align:top}
th{background:#eef1f4;white-space:nowrap}
.tag{padding:1px 6px;border-radius:3px;font-size:12px}
.s-new{background:#dbeafe;color:#1d4ed8;font-weight:600}.s-ok{background:#e6f4ea;color:#1e6b3a}.s-wait{background:#fff4d6;color:#8a5a00}.s-off{background:#eee;color:#666}
.row{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
select{padding:6px 8px;font:inherit;border:1px solid #9aa5b1;border-radius:3px;background:#fff}
input[type=text],input[type=password],input[type=number]{padding:6px 8px;font:inherit;border:1px solid #9aa5b1;border-radius:3px}
#msg{margin:8px 0;min-height:20px}.err{color:#b8272c}.ok{color:#1e6b3a}
#login{max-width:320px;margin:60px auto;background:#fff;padding:20px;border:1px solid #d9dee3}
#login h2{margin:0 0 12px;font-size:16px}#login input{width:100%;margin-bottom:10px}
.note{max-width:260px;color:#52606d}
</style></head>
<body>
<div id="login">
  <h2>관리자 로그인</h2>
  <form id="lf"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
  <button class="btn pri" style="width:100%;padding:8px" type="submit">로그인</button></form>
  <div id="lmsg" class="err"></div>
</div>

<div id="app" hidden>
<header><h1>J Shine 사진 접수 관리</h1><button class="btn" id="out">로그아웃</button></header>
<main>
  <nav><button id="t1" class="on">업체</button><button id="t2">접수 목록</button></nav>
  <div id="msg"></div>

  <section id="p1">
    <form id="cf" class="row"><input id="cname" type="text" placeholder="업체명" maxlength="40" required>
      <input id="climit" type="number" min="1" placeholder="월 용량 한도(MB)" style="width:160px">
      <button class="btn pri" type="submit">업체 등록</button></form>
    <table><thead><tr><th>ID</th><th>업체명</th><th>상태</th><th>월 한도</th><th>링크</th></tr></thead><tbody id="cbody"></tbody></table>
  </section>

  <section id="p2" hidden>
    <div class="row"><input id="q" type="text" placeholder="업체/차량/작업/접수번호 검색" style="width:280px">
      <select id="flt"><option value="">전체</option><option value="new">신규 (다운로드 미확인)</option><option value="done">다운로드 확인함</option><option value="gone">삭제됨</option></select>
      <button class="btn" id="rf">새로고침</button><span id="storage" class="note"></span></div>
    <table><thead><tr><th>접수번호</th><th>업체</th><th>작업 대상</th><th>작업 내용</th><th>접수일시</th><th>상태</th><th>사진</th><th>용량</th><th>다운로드</th><th>특이사항</th></tr></thead><tbody id="rbody"></tbody></table>
  </section>
</main>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
let session = '';
try { session = sessionStorage.getItem('adm') || ''; } catch (e) {}

const call = async body => {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ session, ...body }) }).then(x => x.json());
  if (!r.ok) {
    if (/로그인이 필요/.test(r.error)) logout(true);
    throw new Error(r.error);
  }
  return r;
};
const msg = (t, cls) => { $('msg').className = cls || ''; $('msg').textContent = t || ''; };
const mk = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const mb = b => (Number(b) / 1048576).toFixed(1) + 'MB';
const linkOf = token => new URL('index.html?t=' + token, location.href).href;

function show(logged) { $('login').hidden = logged; $('app').hidden = !logged; }
function logout(expired) {
  session = ''; try { sessionStorage.removeItem('adm'); } catch (e) {}
  show(false); $('lmsg').textContent = expired ? '세션이 만료되었습니다. 다시 로그인하세요' : '';
}

$('lf').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'adminLogin', password: $('pw').value }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error);
    session = r.session; try { sessionStorage.setItem('adm', session); } catch (e) {}
    $('pw').value = ''; $('lmsg').textContent = '';
    show(true); loadCompanies();
  } catch (err) { $('lmsg').textContent = err.message; }
};
$('out').onclick = () => logout(false);

function tab(n) {
  $('p1').hidden = n !== 1; $('p2').hidden = n !== 2;
  $('t1').className = n === 1 ? 'on' : ''; $('t2').className = n === 2 ? 'on' : '';
  msg(''); n === 1 ? loadCompanies() : loadReceipts();
}
$('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2);

async function copy(text) {
  try { await navigator.clipboard.writeText(text); msg('링크를 복사했습니다', 'ok'); }
  catch (e) { prompt('복사해서 사용하세요', text); }
}

async function loadCompanies() {
  try {
    const { companies } = await call({ action: 'companyList' });
    $('cbody').replaceChildren(...companies.map(c => {
      const tr = mk('tr'), active = c.status === '사용';
      tr.append(mk('td', c.id), mk('td', c.name), mk('td'), mk('td', c.limitMB + 'MB'), mk('td'));
      tr.children[2].append(mk('span', c.status, 'tag ' + (active ? 's-ok' : 's-off')));
      const cp = mk('button', '링크 복사', 'btn pri'); cp.disabled = !active; cp.onclick = () => copy(linkOf(c.token));
      const rv = mk('button', '폐기', 'btn warn'); rv.disabled = !active;
      rv.onclick = async () => { if (!confirm(c.name + ' 링크를 폐기할까요? 이 링크로는 더 이상 업로드할 수 없습니다.')) return;
        try { await call({ action: 'companyRevoke', id: c.id }); msg('폐기했습니다', 'ok'); loadCompanies(); } catch (e) { msg(e.message, 'err'); } };
      const ri = mk('button', '재발급', 'btn');
      ri.onclick = async () => { if (!confirm(c.name + ' 링크를 재발급할까요? 이전 링크는 즉시 사용할 수 없게 됩니다.')) return;
        try { await call({ action: 'companyReissue', id: c.id }); msg('재발급했습니다. 새 링크를 복사해 전달하세요', 'ok'); loadCompanies(); } catch (e) { msg(e.message, 'err'); } };
      tr.children[4].append(cp, ' ', rv, ' ', ri);
      return tr;
    }));
  } catch (e) { msg(e.message, 'err'); }
}

$('cf').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await call({ action: 'companyCreate', name: $('cname').value, limitMB: $('climit').value });
    $('cname').value = ''; $('climit').value = '';
    msg(r.company.name + ' 등록 완료. 목록에서 링크를 복사하세요', 'ok'); loadCompanies();
  } catch (err) { msg(err.message, 'err'); }
};

let receipts = [];
async function loadReceipts() {
  try {
    const r = await call({ action: 'receiptList' });
    receipts = r.receipts;
    const gb = x => (Number(x) / 1073741824).toFixed(1) + 'GB';
    $('storage').textContent = '드라이브 ' + gb(r.storage.used) + ' / ' + gb(r.storage.limit) + ' 사용';
    drawReceipts();
  } catch (e) { msg(e.message, 'err'); }
}
function drawReceipts() {
  const q = $('q').value.trim().toLowerCase(), f = $('flt').value;
  const rows = receipts.filter(r => {
    if (q && ![r.no, r.company, r.vehicle, r.work].join(' ').toLowerCase().includes(q)) return false;
    const gone = r.deleted === '삭제됨', done = !!r.downloaded;
    if (f === 'new') return r.status === '접수완료' && !done && !gone;
    if (f === 'done') return done && !gone;
    if (f === 'gone') return gone;
    return true;
  });
  $('rbody').replaceChildren(...rows.map(r => {
    const tr = mk('tr'), complete = r.status === '접수완료', gone = r.deleted === '삭제됨';
    tr.append(mk('td', r.no), mk('td', r.company), mk('td', r.vehicle), mk('td', r.work), mk('td', r.at), mk('td'),
      mk('td', r.count + '장'), mk('td', mb(r.bytes)), mk('td'), mk('td', r.note, 'note'));
    const st = tr.children[5];
    if (!complete) st.append(mk('span', r.status, 'tag s-wait'));
    else if (gone) st.append(mk('span', '삭제됨', 'tag s-off'));
    else if (!r.downloaded) st.append(mk('span', '신규', 'tag s-new'));
    else st.append(mk('span', '확인함', 'tag s-ok'));
    const dl = tr.children[8];
    if (r.downloaded) dl.textContent = r.downloaded;
    else if (complete && !gone) {
      const b = mk('button', '다운로드 확인', 'btn');
      b.onclick = async () => {
        try { await call({ action: 'receiptDownloaded', no: r.no }); msg(r.no + ' 다운로드 확인을 기록했습니다', 'ok'); loadReceipts(); }
        catch (e) { msg(e.message, 'err'); }
      };
      dl.append(b);
    }
    return tr;
  }));
}
$('q').oninput = drawReceipts; $('flt').onchange = drawReceipts; $('rf').onclick = loadReceipts;

if (session) { show(true); loadCompanies(); } else show(false);
</script></body></html>
