<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>J Shine 관리자</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="admin-apple-touch-icon.png">
<link rel="manifest" href="admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="J Shine 관리자">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8e8e93;--line:#e5e5ea;--blue:#007aff;--red:#ff3b30;--green:#34c759;--orange:#ff9f0a;--fill:#e5e5ea;--bar:rgba(249,249,249,.85);
  --new-bg:rgba(0,122,255,.12);--ok-bg:rgba(52,199,89,.16);--wait-bg:rgba(255,159,10,.18);--off-bg:rgba(142,142,147,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--line:#38383a;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;--fill:#2c2c2e;--bar:rgba(22,22,24,.85)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}

/* 로그인 */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{width:100%;max-width:340px;text-align:center}
.lbox img{width:84px;height:84px;border-radius:19px;margin-bottom:14px}
.lbox h1{font-size:26px;margin:0 0 20px;letter-spacing:-.3px}
.lbox .field{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
.lbox input{width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:14px 16px;outline:0}
.lerr{color:var(--red);min-height:20px;margin-top:10px;font-size:14px}

/* 상단 바 */
header{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.hin{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand img{width:28px;height:28px;border-radius:7px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.hin .seg{margin:0 auto}
.seg button{border:0;background:transparent;padding:5px 18px;border-radius:7px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.link{border:0;background:transparent;color:var(--blue);padding:6px 4px}

main{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
h2{font-size:28px;margin:6px 0 14px;letter-spacing:-.3px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.sec{font-size:13px;color:var(--sub);margin:22px 16px 6px}

/* 폼 */
.form{display:flex;gap:10px;flex-wrap:wrap;padding:12px}
.form input{flex:1;min-width:150px;border:0;background:var(--fill);color:var(--text);font:inherit;padding:10px 12px;border-radius:9px;outline:0}
.pbtn{border:0;background:var(--blue);color:#fff;font-weight:600;padding:10px 18px;border-radius:9px}
.pbtn:active{opacity:.8}
.tint{border:0;background:var(--new-bg);color:var(--blue);font-weight:600;padding:6px 12px;border-radius:8px}
.tint:disabled{opacity:.35}
.tbtn{border:0;background:transparent;color:var(--blue);padding:6px 8px}
.tbtn.red{color:var(--red)}.tbtn:disabled{opacity:.3}

/* 표 */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--sub);padding:10px 14px;border-bottom:.5px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:.5px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--sub);font-size:13px}
.acts{white-space:nowrap;text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-new{background:var(--new-bg);color:var(--blue)}.p-ok{background:var(--ok-bg);color:var(--green)}
.p-wait{background:var(--wait-bg);color:var(--orange)}.p-off{background:var(--off-bg);color:var(--sub)}
.empty{padding:28px;text-align:center;color:var(--sub)}

/* 접수 도구줄 */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;border:0;background:var(--fill);color:var(--text);font:inherit;padding:9px 12px;border-radius:9px;outline:0}
.store{margin:0 0 14px;font-size:13px;color:var(--sub)}
.sbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px;max-width:360px}
.sbar i{display:block;height:100%;background:var(--blue)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(40,40,42,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;max-width:88vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:rgba(200,40,30,.95)}
</style></head>
<body>

<div id="login">
  <div class="lbox">
    <img src="admin-icon-192.png" alt="">
    <h1>J Shine 관리자</h1>
    <form id="lf">
      <div class="field"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required></div>
      <button class="pbtn" style="width:100%;padding:13px" type="submit">로그인</button>
    </form>
    <div id="lmsg" class="lerr"></div>
  </div>
</div>

<div id="app" hidden>
  <header><div class="hin">
    <div class="brand"><img src="admin-icon-192.png" alt="">J Shine</div>
    <div class="seg"><button id="t1" class="on">업체</button><button id="t2">접수 목록</button></div>
    <button class="link" id="out">로그아웃</button>
  </div></header>

  <main>
    <section id="p1">
      <h2>업체</h2>
      <div class="card">
        <form id="cf" class="form">
          <input id="cname" type="text" placeholder="새 업체명" maxlength="40" required>
          <input id="climit" type="number" min="1" placeholder="월 업로드 한도 (MB, 비우면 2000)" style="max-width:260px">
          <button class="pbtn" type="submit">업체 등록</button>
        </form>
      </div>
      <div class="sec">등록된 업체</div>
      <div class="card scroll"><table>
        <thead><tr><th>ID</th><th>업체명</th><th>상태</th><th>월 한도</th><th></th></tr></thead>
        <tbody id="cbody"></tbody>
      </table></div>
    </section>

    <section id="p2" hidden>
      <h2>접수 목록</h2>
      <div class="store"><span id="storage"></span><div class="sbar" id="sbarwrap" hidden><i id="sbar"></i></div></div>
      <div class="tools">
        <input id="q" class="search" type="search" placeholder="업체, 작업, 접수번호 검색">
        <div class="seg" id="flt">
          <button data-f="" class="on">전체</button><button data-f="new">신규</button><button data-f="done">확인함</button><button data-f="gone">삭제됨</button>
        </div>
        <button class="tbtn" id="rf">새로고침</button>
      </div>
      <div class="card scroll"><table>
        <thead><tr><th>접수번호</th><th>업체</th><th>작업</th><th>접수일시</th><th>사진</th><th>상태</th><th>다운로드</th></tr></thead>
        <tbody id="rbody"></tbody>
      </table></div>
    </section>
  </main>
</div>

<div id="toast" hidden></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
let session = '';
try { session = sessionStorage.getItem('adm') || ''; } catch (e) {}

const call = async body => {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ session, ...body }) }).then(x => x.json());
  if (!r.ok) {
    if (/로그인이 필요/.test(r.error)) logout(true);
    throw new Error(r.error);
  }
  return r;
};
let toastTimer;
function msg(t, kind) {
  const el = $('toast'); clearTimeout(toastTimer);
  if (!t) { el.hidden = true; return; }
  el.textContent = t; el.className = kind === 'err' ? 'err' : ''; el.hidden = false;
  toastTimer = setTimeout(() => { el.hidden = true; }, kind === 'err' ? 6000 : 3000);
}
const mk = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const mb = b => (Number(b) / 1048576).toFixed(1) + 'MB';
const linkOf = token => new URL('index.html?t=' + token, location.href).href;
function emptyRow(text, cols) {
  const tr = mk('tr'), td = mk('td', text, 'empty'); td.colSpan = cols; tr.append(td); return tr;
}

function show(logged) { $('login').hidden = logged; $('app').hidden = !logged; }
function logout(expired) {
  session = ''; try { sessionStorage.removeItem('adm'); } catch (e) {}
  show(false); $('lmsg').textContent = expired ? '세션이 만료되었습니다. 다시 로그인하세요' : '';
}

$('lf').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'adminLogin', password: $('pw').value }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error);
    session = r.session; try { sessionStorage.setItem('adm', session); } catch (e) {}
    $('pw').value = ''; $('lmsg').textContent = '';
    show(true); loadCompanies();
  } catch (err) { $('lmsg').textContent = err.message; }
};
$('out').onclick = () => logout(false);

function tab(n) {
  $('p1').hidden = n !== 1; $('p2').hidden = n !== 2;
  $('t1').className = n === 1 ? 'on' : ''; $('t2').className = n === 2 ? 'on' : '';
  msg(''); n === 1 ? loadCompanies() : loadReceipts();
}
$('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2);

async function copy(text) {
  try { await navigator.clipboard.writeText(text); msg('링크를 복사했습니다'); }
  catch (e) { prompt('복사해서 사용하세요', text); }
}

async function loadCompanies() {
  try {
    const { companies } = await call({ action: 'companyList' });
    if (!companies.length) { $('cbody').replaceChildren(emptyRow('등록된 업체가 없습니다', 5)); return; }
    $('cbody').replaceChildren(...companies.map(c => {
      const tr = mk('tr'), active = c.status === '사용';
      tr.append(mk('td', c.id, 'sub num'), mk('td', c.name), mk('td'), mk('td', c.limitMB + 'MB', 'num'), mk('td', null, 'acts'));
      tr.children[2].append(mk('span', c.status, 'pill ' + (active ? 'p-ok' : 'p-off')));
      const cp = mk('button', '링크 복사', 'tint'); cp.disabled = !active; cp.onclick = () => copy(linkOf(c.token));
      const ri = mk('button', '재발급', 'tbtn');
      ri.onclick = async () => { if (!confirm(c.name + ' 링크를 재발급할까요?\n이전 링크는 즉시 사용할 수 없게 되고, 업체는 새 링크로 앱을 다시 추가해야 합니다.')) return;
        try { await call({ action: 'companyReissue', id: c.id }); msg('재발급했습니다. 새 링크를 복사해 전달하세요'); loadCompanies(); } catch (e) { msg(e.message, 'err'); } };
      const rv = mk('button', '폐기', 'tbtn red'); rv.disabled = !active;
      rv.onclick = async () => { if (!confirm(c.name + ' 링크를 폐기할까요?\n이 링크로는 더 이상 업로드할 수 없습니다.')) return;
        try { await call({ action: 'companyRevoke', id: c.id }); msg('폐기했습니다'); loadCompanies(); } catch (e) { msg(e.message, 'err'); } };
      tr.children[4].append(cp, ri, rv);
      return tr;
    }));
  } catch (e) { msg(e.message, 'err'); }
}

$('cf').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await call({ action: 'companyCreate', name: $('cname').value, limitMB: $('climit').value });
    $('cname').value = ''; $('climit').value = '';
    msg(r.company.name + ' 등록 완료. 목록에서 링크를 복사하세요'); loadCompanies();
  } catch (err) { msg(err.message, 'err'); }
};

let receipts = [], filter = '';
async function loadReceipts() {
  try {
    const r = await call({ action: 'receiptList' });
    receipts = r.receipts;
    const gb = x => (Number(x) / 1073741824).toFixed(1) + 'GB';
    $('storage').textContent = '드라이브 ' + gb(r.storage.used) + ' / ' + gb(r.storage.limit) + ' 사용';
    const pct = r.storage.limit ? Math.min(100, r.storage.used / r.storage.limit * 100) : 0;
    $('sbarwrap').hidden = !r.storage.limit; $('sbar').style.width = pct + '%';
    $('sbar').style.background = pct > 90 ? 'var(--red)' : pct > 75 ? 'var(--orange)' : 'var(--blue)';
    drawReceipts();
  } catch (e) { msg(e.message, 'err'); }
}
function drawReceipts() {
  const q = $('q').value.trim().toLowerCase();
  const rows = receipts.filter(r => {
    if (q && ![r.no, r.company, r.vehicle, r.work].join(' ').toLowerCase().includes(q)) return false;
    const gone = r.deleted === '삭제됨', done = !!r.downloaded;
    if (filter === 'new') return r.status === '접수완료' && !done && !gone;
    if (filter === 'done') return done && !gone;
    if (filter === 'gone') return gone;
    return true;
  });
  if (!rows.length) { $('rbody').replaceChildren(emptyRow('표시할 접수가 없습니다', 7)); return; }
  $('rbody').replaceChildren(...rows.map(r => {
    const tr = mk('tr'), complete = r.status === '접수완료', gone = r.deleted === '삭제됨';
    const work = mk('td'); work.append(mk('div', [r.vehicle, r.work].filter(Boolean).join(' · ')));
    if (r.note) work.append(mk('div', r.note, 'sub'));
    tr.append(mk('td', r.no, 'num'), mk('td', r.company), work, mk('td', r.at, 'sub num'), mk('td', r.count + '장 · ' + mb(r.bytes), 'num'), mk('td'), mk('td'));
    const st = tr.children[5];
    if (!complete) st.append(mk('span', r.status, 'pill p-wait'));
    else if (gone) st.append(mk('span', '삭제됨', 'pill p-off'));
    else if (!r.downloaded) st.append(mk('span', '신규', 'pill p-new'));
    else st.append(mk('span', '확인함', 'pill p-ok'));
    const dl = tr.children[6];
    if (r.downloaded) { dl.textContent = r.downloaded; dl.className = 'sub num'; }
    else if (complete && !gone) {
      const b = mk('button', '다운로드 확인', 'tint');
      b.onclick = async () => {
        try { await call({ action: 'receiptDownloaded', no: r.no }); msg(r.no + ' 다운로드 확인을 기록했습니다'); loadReceipts(); }
        catch (e) { msg(e.message, 'err'); }
      };
      dl.append(b);
    }
    return tr;
  }));
}
$('q').oninput = drawReceipts; $('rf').onclick = loadReceipts;
$('flt').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; [...$('flt').children].forEach(x => x.className = x === b ? 'on' : ''); drawReceipts();
};

if (session) { show(true); loadCompanies(); } else show(false);
</script></body></html>
